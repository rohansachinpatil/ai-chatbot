<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat Bot</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Text:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
</head>
<body>

<!-- ── Sidebar ── -->
<aside class="sidebar" id="sidebar">
  <div class="sb-header">
    <button class="icon-btn" id="closeBtn" title="Close sidebar">&#9776;</button>
    <button class="new-chat-btn" id="newChatBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>
  </div>

  <div class="sb-section-label">Recent</div>
  <div class="history-list" id="historyList">
    <div class="history-empty">No conversations yet.</div>
  </div>

  <div class="sb-footer">
    <div class="model-card">
      <div class="model-card-row">
        <span class="model-card-key">Model</span>
        <span class="model-card-val" style="color:#1a73e8">mistral-small-latest</span>
      </div>
      <div class="model-card-row">
        <span class="model-card-key">Temperature</span>
        <span class="model-card-val">0.0</span>
      </div>
      <div class="model-card-row">
        <span class="model-card-key">Max tokens</span>
        <span class="model-card-val">2 048</span>
      </div>
    </div>
  </div>
</aside>

<!-- ── Sidebar overlay (mobile) ── -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- ── Main ── -->
<main class="main" id="main">

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" id="menuBtn" title="Menu">&#9776;</button>
      <span class="topbar-title">AI Chat Bot</span>
    </div>
    <div class="topbar-right">
      <div class="badge-live"><span class="dot-live"></span>Live</div>
      <div class="model-tag">mistral-small-latest</div>
    </div>
  </header>

  <!-- Token bar -->
  <div class="tok-bar" id="tokBar">
    <span class="tok-bar-label">🪙 Tokens used</span>
    <div class="tok-track"><div class="tok-fill" id="tokFill" style="width:0%"></div></div>
    <span class="tok-bar-val" id="tokVal">0 / 32 000</span>
  </div>

  <!-- Chat area -->
  <div class="chat-area" id="chatArea">
    <!-- Empty state -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">✦</div>
      <h1 class="empty-title">Hello, I'm your AI Chat Bot.</h1>
      <p class="empty-sub">Your intelligent assistant, ready to help with anything.</p>
      <div class="sug-grid">
        <button class="sug-btn" onclick="fillSuggestion(this)">
          <span class="sug-i">🧠</span>Explain quantum computing simply
        </button>
        <button class="sug-btn" onclick="fillSuggestion(this)">
          <span class="sug-i">✍️</span>Write a compelling story opener
        </button>
        <button class="sug-btn" onclick="fillSuggestion(this)">
          <span class="sug-i">💡</span>5 innovative startup ideas for 2025
        </button>
        <button class="sug-btn" onclick="fillSuggestion(this)">
          <span class="sug-i">🔬</span>How does CRISPR gene editing work?
        </button>
      </div>
    </div>
  </div>

  <!-- Input bar (always fixed at bottom) -->
  <div class="input-bar">
    <textarea
      id="msgInput"
      class="msg-input"
      placeholder="Message AI Chat Bot…"
      rows="1"
      maxlength="8000"
    ></textarea>
    <div class="btn-row">
      <button class="btn btn-send" id="sendBtn" onclick="sendMessage()">Send ↑</button>
      <button class="btn btn-regen" id="regenBtn" onclick="regenerate()">↻ Redo</button>
      <button class="btn btn-clear" onclick="clearChat()">🗑 Clear</button>
    </div>
  </div>

</main>

<script src="/static/app.js"></script>
</body>
</html>
